name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (requires-python) and the version used for development.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,ib]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src

      # live_llm tests are excluded by `addopts` in pyproject.toml, so this
      # needs no network access and no API key. The execd integration tests
      # skip here (no Rust binary); the execution-service job runs them.
      - name: Test
        run: pytest

  execution-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: execution_service
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: execution_service

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      # The Python adapter against the real binary: catches the two sides of
      # the wire protocol drifting apart.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cross-language tests
        working-directory: .
        env:
          EXECD_BIN: execution_service/target/debug/execd
        run: |
          pip install -e ".[dev]"
          pytest tests/integration/test_execd_roundtrip.py -v
