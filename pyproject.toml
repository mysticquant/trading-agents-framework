[project]
name = "trading-agents"
version = "0.1.0"
description = "Multi-agent LLM trading framework (screener, analysts, researcher, trader, risk manager, portfolio manager) with pluggable broker adapters and a backtest runner."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "mypy",
]

[project.scripts]
trading-agents = "trading_agents.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-m 'not live_llm'"
markers = [
    "live_llm: hits the real Anthropic API and costs real money; opt-in only",
]

[tool.mypy]
python_version = "3.11"
packages = ["trading_agents"]
mypy_path = "src"
ignore_missing_imports = true
